name: 09 VIDEO AI ingest worker

on:
  pull_request:
    paths:
      - "workers/video-ingest/**"
      - ".github/workflows/video-ingest-worker.yml"
  push:
    branches:
      - "feature/09-video-ai-foundation"
    paths:
      - "workers/video-ingest/**"
      - ".github/workflows/video-ingest-worker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: workers/video-ingest
        run: npm install
      - name: TypeScript build
        working-directory: workers/video-ingest
        run: npm run build
      - name: Build worker container
        run: docker build -t 09-video-ingest ./workers/video-ingest
