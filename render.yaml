services:
  - type: worker
    name: 09-video-ingest
    runtime: docker
    dockerfilePath: ./workers/video-ingest/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POLL_INTERVAL_MS
        value: "4000"
      - key: WORKER_CONCURRENCY
        value: "1"
